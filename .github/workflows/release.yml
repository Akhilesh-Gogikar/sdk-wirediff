name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - run: python -m pip install --no-deps .
      - run: python -m unittest -v
      - run: sdk-wirediff compare fixtures/demo/manifest.json --allow-command --json demo-output/diff.json --html demo-output/diff.html --repro demo-output/repro.json

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create source-only GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes are the matching CHANGELOG section so non-code credit is preserved.
          awk -v version="${GITHUB_REF_NAME#v}" 'index($0, "## [" version "]") == 1 {found=1; next} found && /^## \[/ {exit} found' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file release-notes.md --title "SDK WireDiff $GITHUB_REF_NAME"
